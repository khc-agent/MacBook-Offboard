<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KHC MacBook Offboarding · 중고 맥북 판매 안내</title>
<style>
  /* NOTE: this page targets an old LG TV browser as well as modern browsers.
     Avoid CSS features that old smart-TV WebKit/Chromium builds don't support:
     no CSS Grid, no flexbox `gap`, no CSS custom properties (var()), no `inset`
     shorthand, no 3D transforms (perspective/rotateX/backface-visibility). */

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #08090a;
    background-image:
      radial-gradient(ellipse at top, #16181c 0%, #08090a 60%);
    color: #f2ede0;
    font-family: 'Courier New', Courier, monospace;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Fixed 16:9 design canvas (1920x1080), scaled to fill any screen size —
     tuned for full-screen kiosk display on large (e.g. 75") monitors. */
  .stage {
    width: 1920px;
    height: 1080px;
    flex: none;
    transform-origin: center center;
  }

  .wrap {
    width: 100%;
    height: 100%;
    padding: 40px 56px;
    display: flex;
    flex-direction: column;
  }

  /* ---------- Header ---------- */
  .board-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    padding: 0 6px 26px;
    border-bottom: 1px solid #2a2c31;
    margin-bottom: 30px;
    flex: none;
  }

  .board-header h1 {
    font-size: 40px;
    letter-spacing: 3px;
    margin: 0 0 10px;
    color: #e8b559;
    font-weight: 700;
  }

  .board-header .sub {
    color: #8a8d95;
    font-size: 19px;
    letter-spacing: 1px;
  }

  .header-right {
    text-align: right;
    color: #8a8d95;
    font-size: 19px;
    line-height: 1.7;
  }

  .header-right .clock {
    color: #e8b559;
    font-size: 34px;
    letter-spacing: 2px;
    font-weight: 700;
  }

  /* ---------- Board case ---------- */
  .case {
    background: #0b0c0e;
    border-radius: 14px;
    padding: 26px 22px;
    box-shadow:
      inset 0 0 0 1px #232529,
      0 30px 60px -20px rgba(0,0,0,0.7);
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
  }

  /* column proportions, done with flex-grow ratios (old-browser safe) instead
     of CSS Grid `fr` tracks; must stay in sync with COLS in the script below */
  .col--id,     .cell--id     { flex: 1.3 0 auto; }
  .col--cpu,    .cell--cpu    { flex: 1.15 0 auto; }
  .col--size,   .cell--size   { flex: 0.8 0 auto; }
  .col--specs,  .cell--specs  { flex: 1.8 0 auto; }
  .col--battery,.cell--battery{ flex: 1.9 0 auto; }
  .col--grade,  .cell--grade  { flex: 0.9 0 auto; }
  .col--price,  .cell--price  { flex: 1.7 0 auto; }

  .col-titles, .row {
    display: flex;
    align-items: center;
  }

  .col-titles > div, .row > .cell {
    min-width: 0;
    margin-right: 14px;
  }

  .col-titles > div:last-child, .row > .cell:last-child {
    margin-right: 0;
  }

  .col-titles {
    padding: 0 6px 14px;
    color: #8a8d95;
    font-size: 16px;
    letter-spacing: 2px;
    border-bottom: 1px dashed #2a2c31;
    margin-bottom: 14px;
    flex: none;
  }

  /* ---------- Sort view tabs ---------- */
  .view-tabs {
    display: flex;
    padding: 0 6px 20px;
    flex: none;
  }

  .view-tab {
    display: flex;
    align-items: center;
    background: #17181b;
    border: 1px solid #2a2c31;
    color: #8a8d95;
    border-radius: 999px;
    padding: 10px 22px;
    font-size: 16px;
    letter-spacing: 1px;
    cursor: pointer;
    margin-right: 10px;
  }

  .view-tab .dash {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #3a3c42;
    margin-right: 8px;
  }

  .view-tab.active {
    color: #e8b559;
    border-color: #e8b559;
    background: rgba(232,181,89,0.08);
  }

  .view-tab.active .dash { background: #e8b559; }

  #board {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .row {
    flex: 1;
    min-height: 0;
    padding: 0 6px;
    margin-bottom: 6px;
  }

  .row:last-child { margin-bottom: 0; }

  .row .cell { height: 100%; }

  /* ---------- Flap card ---------- */
  .flap {
    position: relative;
    height: 100%;
    border-radius: 6px;
    background: #1c1e22;
    box-shadow: inset 0 0 0 1px #050506;
    overflow: hidden;
  }

  .flap-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform 170ms ease-in;
  }

  /* card "rotates" one at a time: squeeze flat, swap text, spring back open */
  .flap.flipping .flap-inner {
    transform: scaleY(0.06);
  }

  .face {
    position: absolute;
    top: 0; right: 0; bottom: 0; left: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 14px;
    font-size: 19px;
    letter-spacing: 0.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .cell--id .face { color: #e8b559; font-weight: 700; }
  .cell--price .face { color: #f2ede0; font-weight: 700; justify-content: flex-end; padding-right: 18px; }
  .cell--price .face::after { content: " 원"; color: #8a8d95; font-weight: 400; margin-left: 2px; }
  .cell--grade .face { font-weight: 700; }

  .grade-1 .face { color: #4fae7a; }
  .grade-2 .face { color: #4f8fd6; }
  .grade-3 .face { color: #d6b74f; }
  .grade-4 .face { color: #d68f4f; }
  .grade-5 .face { color: #cf5f5f; }

  /* ---------- Footer controls ---------- */
  .board-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 28px;
    padding: 0 6px;
    flex-wrap: wrap;
    flex: none;
  }

  .footer-right { display: flex; align-items: center; }

  .dots { display: flex; margin-right: 14px; }
  .dot {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: #33353a;
    cursor: pointer;
    margin-right: 10px;
  }
  .dot:last-child { margin-right: 0; }
  .dot.active { background: #e8b559; }

  .nav-btns { display: flex; }
  .nav-btns button {
    background: #17181b;
    color: #f2ede0;
    border: 1px solid #2a2c31;
    border-radius: 8px;
    width: 44px;
    height: 44px;
    cursor: pointer;
    font-size: 19px;
    margin-right: 10px;
  }
  .nav-btns button:last-child { margin-right: 0; }

  .legend {
    color: #8a8d95;
    font-size: 16px;
    letter-spacing: 0.5px;
  }
  .legend span { margin-right: 16px; }

  .source-link {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #8a8d95;
    font-size: 15px;
    letter-spacing: 0.5px;
    flex: none;
  }
  .source-link a { color: #e8b559; text-decoration: none; }
</style>
</head>
<body>

<div class="stage" id="stage">
<div class="wrap">

  <div class="board-header">

  <div class="board-footer">

        <button id="prevBtn">‹</button>
        <button id="nextBtn">›</button>
      </div>
    </div>
  </div>

  <div class="source-link">
    원본 데이터: <a href="https://app.notion.com/p/khcmst/e418750bf4794a83ad315fb7e9a5007c" target="_blank" rel="noopener">Notion · 판매 대상 중고 컴퓨터 목록</a>
  </div>

</div>
</div>

<script>
  // ---------------- Full-screen fit: scale the 1920x1080 stage to the viewport ----------------
  function fitStage(){
    var stage = document.getElementById("stage");
    var scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = "scale(" + scale + ")";
  }
  fitStage();
  window.addEventListener("resize", fitStage);

  // ---------------- Data (Notion "판매 대상 중고 컴퓨터 목록" 기준, 기기 번호 오름차순) ----------------
  var DATA = [
    { no:1,  id:"KHCN0011", cpu:"M1 PRO", size:"16", specs:"16GPU/16GB/512GB", battery:"79.47% · 313회", grade:5, price:"840,000" },
    { no:2,  id:"KHCN0023", cpu:"M1 MAX", size:"16", specs:"32GPU/32GB/1TB",   battery:"83.37% · 228회", grade:4, price:"1,030,000" },
    { no:3,  id:"KHCN0024", cpu:"M1 MAX", size:"16", specs:"32GPU/32GB/1TB",   battery:"84.93% · 339회", grade:4, price:"1,260,000" },
    { no:4,  id:"KHCN0028", cpu:"M1 PRO", size:"14", specs:"16GPU/16GB/1TB",   battery:"85.82% · 223회", grade:3, price:"787,000" },
    { no:5,  id:"KHCN0035", cpu:"M1 PRO", size:"16", specs:"16GPU/16GB/512GB", battery:"89.75% · 128회", grade:3, price:"706,000" },
    { no:6,  id:"KHCN0040", cpu:"M1 MAX", size:"16", specs:"32GPU/32GB/1TB",   battery:"86.36% · 215회", grade:4, price:"1,710,000" },
    { no:7,  id:"KHCN0089", cpu:"M1 PRO", size:"16", specs:"16GPU/32GB/1TB",   battery:"92.03% · 66회",  grade:2, price:"1,490,000" },
    { no:8,  id:"KHCN0090", cpu:"M1 PRO", size:"16", specs:"16GPU/32GB/1TB",   battery:"82.63% · 407회", grade:4, price:"1,030,000" },
    { no:9,  id:"KHCN0091", cpu:"M1 PRO", size:"16", specs:"16GPU/32GB/1TB",   battery:"96.64% · 174회", grade:1, price:"1,030,000" },
    { no:10, id:"KHCN0093", cpu:"M1 PRO", size:"16", specs:"16GPU/32GB/1TB",   battery:"80.77% · 210회", grade:4, price:"770,000" },
    { no:11, id:"KHCN0099", cpu:"M1 PRO", size:"14", specs:"16GPU/16GB/1TB",   battery:"78.68% · 242회", grade:5, price:"756,000" },
    { no:12, id:"KHCN0107", cpu:"M1 PRO", size:"16", specs:"16GPU/16GB/512GB", battery:"83.90% · 173회", grade:4, price:"520,000" },
    { no:13, id:"KHCN0144", cpu:"M1 PRO", size:"16", specs:"16GPU/32GB/1TB",   battery:"79.58% · 517회", grade:5, price:"1,030,000" },
    { no:14, id:"KHCN0147", cpu:"M1 PRO", size:"14", specs:"16GPU/16GB/1TB",   battery:"79.56% · 359회", grade:5, price:"756,000" },
    { no:15, id:"KHCN0151", cpu:"M1 PRO", size:"14", specs:"16GPU/16GB/1TB",   battery:"85.44% · 303회", grade:4, price:"835,000" },
    { no:16, id:"KHCN0157", cpu:"M1 PRO", size:"14", specs:"16GPU/16GB/1TB",   battery:"79.69% · 408회", grade:5, price:"756,000" },
    { no:17, id:"KHCN0159", cpu:"M1 PRO", size:"14", specs:"16GPU/16GB/1TB",   battery:"89.00% · 192회", grade:3, price:"857,000" },
    { no:18, id:"KHCN0164", cpu:"M1 PRO", size:"14", specs:"16GPU/16GB/1TB",   battery:"89.64% · 230회", grade:3, price:"857,000" },
    { no:19, id:"KHCN0165", cpu:"M1 PRO", size:"14", specs:"16GPU/16GB/1TB",   battery:"84.23% · 233회", grade:3, price:"857,000" },
    { no:20, id:"KHCN0183", cpu:"M1 PRO", size:"14", specs:"16GPU/16GB/1TB",   battery:"86.02% · 191회", grade:3, price:"810,000" },
    { no:21, id:"KHCN0192", cpu:"M2 PRO", size:"14", specs:"16GPU/32GB/512GB", battery:"83.37% · 130회", grade:3, price:"1,120,000" },
    { no:22, id:"KHCN0196", cpu:"M2 PRO", size:"14", specs:"16GPU/32GB/512GB", battery:"79.51% · 284회", grade:4, price:"999,000" },
    { no:23, id:"KHCN0201", cpu:"M2 PRO", size:"14", specs:"16GPU/32GB/512GB", battery:"81.68% · 154회", grade:4, price:"1,120,000" },
    { no:24, id:"KHCN0207", cpu:"M2 PRO", size:"14", specs:"16GPU/16GB/512GB", battery:"81.74% · 184회", grade:3, price:"999,000" },
    { no:25, id:"KHCN0215", cpu:"M2 PRO", size:"14", specs:"16GPU/32GB/512GB", battery:"75.31% · 370회", grade:4, price:"1,045,000" },
    { no:26, id:"KHCN0230", cpu:"M2 PRO", size:"14", specs:"16GPU/32GB/512GB", battery:"86.98% · 173회", grade:3, price:"1,226,000" },
    { no:27, id:"KHCN0231", cpu:"M2 PRO", size:"14", specs:"16GPU/32GB/512GB", battery:"80.52% · 183회", grade:4, price:"1,226,000" },
    { no:28, id:"KHCN0234", cpu:"M2 PRO", size:"14", specs:"16GPU/16GB/512GB", battery:"89.62% · 185회", grade:3, price:"1,430,000" },
    { no:29, id:"KHCN0237", cpu:"M2 PRO", size:"14", specs:"16GPU/32GB/512GB", battery:"93.86% · 38회",  grade:2, price:"1,330,000" },
    { no:30, id:"KHCN0240", cpu:"M2 PRO", size:"14", specs:"16GPU/32GB/512GB", battery:"91.82% · 99회",  grade:2, price:"1,330,000" },
    { no:31, id:"KHCN0241", cpu:"M2 PRO", size:"14", specs:"16GPU/32GB/512GB", battery:"99.85% · 39회",  grade:1, price:"1,120,000" },
    { no:32, id:"KHCN0249", cpu:"M2 PRO", size:"14", specs:"16GPU/32GB/512GB", battery:"90.18% · 94회",  grade:2, price:"1,330,000" },
    { no:33, id:"KHCN0315", cpu:"M3",     size:"14", specs:"10GPU/16GB/512GB", battery:"93.99% · 130회", grade:1, price:"1,415,000" },
  ];

  var PAGE_SIZE = 11;
  var PAGE_COUNT = Math.ceil(DATA.length / PAGE_SIZE);
  var COLS = ["id", "cpu", "size", "specs", "battery", "grade", "price"];

  function priceNum(row){ return parseInt(row.price.replace(/,/g, ""), 10); }
  function idNum(row){ return parseInt(row.id.replace(/\D/g, ""), 10); }

  // ---------------- 3 rotating sort views ----------------
  var VIEWS = [
    {
      key: "id",
      label: "기기번호 순",
      data: DATA.slice().sort(function(a, b){ return idNum(a) - idNum(b); }),
    },
    {
      key: "grade",
      label: "등급 순",
      data: DATA.slice().sort(function(a, b){ return (a.grade - b.grade) || (idNum(a) - idNum(b)); }),
    },
    {
      key: "price",
      label: "판매가 높은 순",
      data: DATA.slice().sort(function(a, b){ return (priceNum(b) - priceNum(a)) || (idNum(a) - idNum(b)); }),
    },
  ];

  var board = document.getElementById("board");
  var dotsWrap = document.getElementById("dots");
  var tabsWrap = document.getElementById("viewTabs");
  var currentView = 0;
  var currentPage = -1;
  var autoTimer = null;

  function fmtCell(row, col){
    if (col === "id") return String(row.no).padStart(2, "0");
    if (col === "size") return row.size + "인치";
    if (col === "grade") return String(row.grade) + "등급";
    return row[col];
  }

  function buildRow(){
    var row = document.createElement("div");
    row.className = "row";
    COLS.forEach(function(col){
      var cell = document.createElement("div");
      cell.className = "cell cell--" + col;
      cell.innerHTML =
        '<div class="flap">' +
          '<div class="flap-inner">' +
            '<div class="face"></div>' +
          '</div>' +
        '</div>';
      row.appendChild(cell);
    });
    return row;
  }

  // build static row skeletons once
  var rowEls = [];
  for (var i = 0; i < PAGE_SIZE; i++) {
    var r = buildRow();
    board.appendChild(r);
    rowEls.push(r);
  }

  function setDots(){
    dotsWrap.innerHTML = "";
    for (var p = 0; p < PAGE_COUNT; p++) {
      var d = document.createElement("div");
      d.className = "dot" + (p === currentPage ? " active" : "");
      (function(p){
        d.addEventListener("click", function(){ goToView(currentView, p); resetAuto(); });
      })(p);
      dotsWrap.appendChild(d);
    }
  }

  function setTabs(){
    tabsWrap.innerHTML = "";
    VIEWS.forEach(function(v, vIdx){
      var tab = document.createElement("div");
      tab.className = "view-tab" + (vIdx === currentView ? " active" : "");
      tab.innerHTML = '<span class="dash"></span><span>' + v.label + "</span>";
      tab.addEventListener("click", function(){ goToView(vIdx, 0); resetAuto(); });
      tabsWrap.appendChild(tab);
    });
  }

  // each card "rotates" (squeeze-flat, swap text, spring open) one at a time,
  // staggered per cell — a 2D transform only, safe on old TV browsers that
  // don't support 3D perspective/backface-visibility.
  function flipCell(cellEl, newText, extraClass, delay){
    setTimeout(function(){
      var flap = cellEl.querySelector(".flap");
      var face = cellEl.querySelector(".face");

      if (face.textContent === newText) return; // no change, skip

      if (extraClass) {
        cellEl.classList.remove("grade-1","grade-2","grade-3","grade-4","grade-5");
        cellEl.classList.add(extraClass);
      }

      flap.classList.add("flipping"); // squeeze flat
      setTimeout(function(){
        face.textContent = newText;
        flap.classList.remove("flipping"); // spring back open
      }, 170);
    }, delay);
  }

  function goToView(viewIdx, pageIdx){
    currentView = viewIdx;
    currentPage = pageIdx;
    var start = pageIdx * PAGE_SIZE;
    var slice = VIEWS[viewIdx].data.slice(start, start + PAGE_SIZE);

    rowEls.forEach(function(rowEl, rIdx){
      var data = slice[rIdx];
      var rowDelay = rIdx * 90;
      var cells = rowEl.querySelectorAll(".cell");
      cells.forEach(function(cellEl, cIdx){
        var col = COLS[cIdx];
        var cellDelay = rowDelay + cIdx * 22;
        if (!data) {
          flipCell(cellEl, "", null, cellDelay);
          return;
        }
        var text = fmtCell(data, col);
        var gradeClass = col === "grade" ? ("grade-" + data.grade) : null;
        flipCell(cellEl, text, gradeClass, cellDelay);
      });
    });

    setDots();
    setTabs();
  }

  // advance: next page within current view, then roll over to the next view
  function nextStep(){
    if (currentPage + 1 < PAGE_COUNT) {
      goToView(currentView, currentPage + 1);
    } else {
      goToView((currentView + 1) % VIEWS.length, 0);
    }
  }

  function prevStep(){
    if (currentPage - 1 >= 0) {
      goToView(currentView, currentPage - 1);
    } else {
      var prevView = (currentView - 1 + VIEWS.length) % VIEWS.length;
      goToView(prevView, PAGE_COUNT - 1);
    }
  }

  function resetAuto(){
    if (autoTimer) clearInterval(autoTimer);
    autoTimer = setInterval(nextStep, 5200);
  }

  document.getElementById("nextBtn").addEventListener("click", function(){ nextStep(); resetAuto(); });
  document.getElementById("prevBtn").addEventListener("click", function(){ prevStep(); resetAuto(); });

  // initial reveal
  setTimeout(function(){ goToView(0, 0); resetAuto(); }, 400);

  // ---------------- Clock ----------------
  function tickClock(){
    var now = new Date();
    var hh = String(now.getHours()).padStart(2,"0");
    var mm = String(now.getMinutes()).padStart(2,"0");
    var ss = String(now.getSeconds()).padStart(2,"0");
    document.getElementById("clock").textContent = hh + ":" + mm + ":" + ss;
    var days = ["일","월","화","수","목","금","토"];
    document.getElementById("dateLine").textContent =
      now.getFullYear() + "." + String(now.getMonth()+1).padStart(2,"0") + "." + String(now.getDate()).padStart(2,"0") +
      " (" + days[now.getDay()] + ")";
  }
  tickClock();
  setInterval(tickClock, 1000);
</script>
